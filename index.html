<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هدية لصديقي</title>
<style>
body{margin:0;font-family:sans-serif;background:#0f0f1a;color:#fff;text-align:center;padding:40px 20px}
.card{background:#1e1e2e;padding:30px;border-radius:20px;max-width:500px;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{color:#ffd700;font-size:32px}
p{font-size:18px;line-height:1.8}
button{background:#ffd700;border:0;padding:14px 28px;border-radius:30px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:15px}
#msg{display:none;margin-top:20px;font-size:20px;color:#ff8fab}
</style>
</head>
<body>
<div class="card">
<h1>🎁 هدية لصديقي</h1>
<p>هذي الصفحة سويتها لك خصيصاً،<br>لأنك صديق ما يتعوض.</p>
<button onclick="document.getElementById('msg').style.display='block'">اضغط هنا ❤️</button>
<div id="msg">أنت أفضل صديق في الدنيا! الله يديمك لي 🤍</div>
</div>
</body>
</html>
